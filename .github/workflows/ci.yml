name: mirage-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Formal verification smoke
        run: python -m mirage verify invariants
      - name: Production config validation
        run: python -m mirage production validate-config
      - name: Migration dry run
        run: python -m mirage storage migrate --dry-run
      - name: Secret scan placeholders
        run: python - <<'PY'
          from pathlib import Path
          banned = ["password=changeme", "secret=changeme", "token=changeme"]
          for path in Path(".").rglob("*"):
              if path.is_file() and ".git" not in path.parts:
                  text = path.read_text(errors="ignore")
                  assert not any(item in text.lower() for item in banned), path
          PY
      - name: Helm value validation smoke
        run: test -f deploy/helm/mirage/values.schema.json
