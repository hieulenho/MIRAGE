profile: shadow
deploymentMode: modular_monolith
productionExecutionEnabled: false
highRiskAutomationEnabled: false
pilotScopes: []
image:
  repository: ghcr.io/example/mirage
  tag: "0.10.0"
replicaCount: 1
auth:
  enabled: false
tls:
  enabled: false
storage:
  backend: sqlite
  existingSecret: ""
