services:
  mirage-control-plane:
    image: python:3.11-slim
    container_name: mirage-control-plane
    command: ["python", "-m", "http.server", "8080"]
    working_dir: /workspace
    volumes:
      - ../:/workspace:ro
    networks:
      - mirage-control
      - mirage-workload
      - mirage-decoy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  attacker-simulator:
    image: python:3.11-slim
    command: ["python", "-c", "import time; print('synthetic attacker ready'); time.sleep(3600)"]
    networks:
      - mirage-workload
    depends_on:
      workstation:
        condition: service_healthy
      application-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  workstation:
    image: python:3.11-slim
    command: ["python", "-m", "http.server", "8081"]
    networks:
      - mirage-workload
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8081), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  application-server:
    image: python:3.11-slim
    command: ["python", "-m", "http.server", "8082"]
    networks:
      - mirage-workload
      - mirage-protected
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8082), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  real-database:
